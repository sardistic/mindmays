services:
  app:
    build:
      context: ./source
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: 4173
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    mem_limit: 512m
    security_opt:
      - no-new-privileges:true
    networks:
      edge:
        aliases:
          - sard-mindmays

networks:
  edge:
    external: true

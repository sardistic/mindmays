  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="description" content="Explore a 100-room retro encyclopedia adventure. Answer Wikipedia-powered knowledge seals, uncover the Unwritten Keep, and challenge friends." />
    <meta name="robots" content="index,follow,max-image-preview:large" />
    <link rel="canonical" href="https://entries.page/" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Entries" />
    <meta property="og:title" content="Entries — The Unwritten Keep" />
    <meta property="og:description" content="Explore a 100-room retro encyclopedia adventure powered by Wikipedia." />

    <meta property="og:image" content="https://entries.page/assets/classic/royal.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Entries — The Unwritten Keep" />
    <meta name="twitter:description" content="Explore a 100-room retro encyclopedia adventure powered by Wikipedia." />
    <meta name="twitter:image" content="https://entries.page/assets/classic/royal.png" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "VideoGame",
        "name": "Entries",
        "alternateName": ["The Unwritten Keep", "WikiMaze"],
        "url": "https://entries.page/",
        "description": "A browser-based retro encyclopedia adventure with 100 chambers and Wikipedia-powered knowledge challenges.",
        "image": "https://entries.page/assets/classic/royal.png",
        "applicationCategory": "Game",
        "gamePlatform": "Web browser",
        "operatingSystem": "Any",
        "playMode": ["SinglePlayer", "CoOp"],
        "genre": ["Adventure", "Educational", "Trivia"],
        "isAccessibleForFree": true,
        "publisher": { "@type": "Organization", "name": "Sardistic Multimedia" }
      }
    </script>
    <script async defer data-cfasync="false" src="https://analytics.sardistic.com/script.js" data-website-id="362a86f4-7b10-4455-a860-3164746e841f" data-domains="entries.page"></script>
    <title>Entries — The Unwritten Keep</title>
    <link rel="stylesheet" href="/intro.css" />
  </head>
  <body>
    <main class="desktop">
      <section class="game-window" aria-label="Entries main menu">
        <header class="os-titlebar"><span class="app-icon">E</span><strong>ENTRIES · MAIN MENU</strong><div class="window-buttons" aria-hidden="true"><i>_</i><i>□</i><i>×</i></div></header>
        <nav class="menu-strip">
          <button data-menu-key="B"><u>G</u>ame</button><button data-menu-key="S"><u>O</u>ptions</button><button data-menu-key="H"><u>H</u>elp</button>
          <small id="build-label">VERSION 1.0 · CD-ROM EDITION</small>
        </nav>

        <section class="title-stage">
          <img class="stage-plate" src="/assets/classic/royal.png" alt="" />
          <div class="stage-scrim"></div>

          <div class="title-lockup">
            <p class="over-title">SARDISTIC MULTIMEDIA PRESENTS</p>
            <h1>Entries</h1>
            <p class="under-title">THE UNWRITTEN KEEP</p>
          </div>

          <ul id="main-menu" class="main-menu" role="menu" aria-label="Main menu"></ul>

          <p class="stage-hint">↑ ↓ to choose · ENTER to open · or click an option</p>

          <section id="panel" class="intro-panel" hidden aria-modal="true" role="dialog" aria-labelledby="panel-title">
            <header><span id="panel-title">Panel</span><button data-close-panel aria-label="Close">×</button></header>
            <div id="panel-body" class="panel-body"></div>
            <footer id="panel-footer"><button data-close-panel>Close</button></footer>
          </section>

          <section id="notice-window" class="notice-window" hidden role="alertdialog" aria-labelledby="notice-text">
            <div id="notice-text"></div>
            <div class="notice-actions"><button id="notice-ok">OK</button><button id="notice-cancel">Cancel</button></div>
          </section>
        </section>

        <footer class="status-line">
          <span id="menu-status">Choose an option to begin.</span>
          <button id="ambience-button" aria-pressed="false" title="Sound is off. Click to enable the menu ambience.">♫ Sound Off</button>
        </footer>
      </section>
    </main>
    <script type="module" src="/intro.js"></script>
  </body>
</html>
